# Hermes Chat Stack
#
# Conversational pipeline: Browser → Traefik → Gateway → Ollama → Stream → Browser
#
# Prerequisites:
#   - External network: docker network create avanzia-shared
#   - Traefik running on avanzia-shared (see hermes-infrastructure/compose/traefik)
#   - Ollama running on avanzia-shared (see hermes-infrastructure/compose/ollama)
#
# Usage:
#   docker compose -f docker-compose.chat.yml build
#   docker compose -f docker-compose.chat.yml up -d
#
# The gateway serves both the API (/v1/chat) and the chat UI (/) on port 8000.
# Traefik routes the configured domain to this port.

services:
  hermes-gateway:
    build: .
    image: hermes-os:latest
    container_name: hermes-gateway
    restart: unless-stopped

    entrypoint: []
    command:
      - "uvicorn"
      - "hermes.gateway.app:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"

    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.2}"

    networks:
      - avanzia-shared

    labels:
      traefik.enable: "true"
      traefik.http.routers.hermes-chat.rule: "Host(`${HERMES_CHAT_DOMAIN}`)"
      traefik.http.routers.hermes-chat.entrypoints: "websecure"
      traefik.http.routers.hermes-chat.tls.certresolver: "mytlschallenge"
      traefik.http.services.hermes-chat.loadbalancer.server.port: "8000"

    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  avanzia-shared:
    external: true
