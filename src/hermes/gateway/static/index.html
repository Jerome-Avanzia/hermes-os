<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2a2d3a;
    --text: #e4e4e7;
    --text-muted: #71717a;
    --accent: #6366f1;
    --accent-hover: #818cf8;
    --user-bg: #1e1e2e;
    --assistant-bg: #16161e;
  }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    max-width: 768px;
    margin: 0 auto;
  }

  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  header .title {
    font-size: 14px;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  #profile-select {
    padding: 6px 10px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    outline: none;
    cursor: pointer;
  }

  #profile-select:focus {
    border-color: var(--accent);
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .message {
    padding: 12px 16px;
    border-radius: 8px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 15px;
    max-width: 85%;
  }

  .message.user {
    background: var(--user-bg);
    align-self: flex-end;
    border: 1px solid var(--border);
  }

  .message.assistant {
    background: var(--assistant-bg);
    align-self: flex-start;
  }

  .message.error {
    background: #2d1b1b;
    color: #f87171;
    align-self: center;
    font-size: 13px;
  }

  #input-area {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
  }

  #input-area textarea {
    flex: 1;
    padding: 10px 14px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 15px;
    resize: none;
    outline: none;
    min-height: 44px;
    max-height: 160px;
  }

  #input-area textarea:focus {
    border-color: var(--accent);
  }

  #input-area button {
    padding: 10px 20px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    white-space: nowrap;
  }

  #input-area button:hover { background: var(--accent-hover); }
  #input-area button:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>

<div id="app">
  <header>
    <span class="title">Hermes</span>
    <select id="profile-select"><option value="">Loading...</option></select>
  </header>
  <div id="messages"></div>
  <div id="input-area">
    <textarea id="input" rows="1" placeholder="Send a message..." autofocus></textarea>
    <button id="send">Send</button>
  </div>
</div>

<script>
(function () {
  const GATEWAY_URL = window.__HERMES_GATEWAY_URL__
    || window.location.origin;

  const messagesEl  = document.getElementById("messages");
  const inputEl     = document.getElementById("input");
  const sendBtn     = document.getElementById("send");
  const profileSel  = document.getElementById("profile-select");

  let history = [];
  let streaming = false;

  // -- Load profiles --------------------------------------------------------

  async function loadProfiles() {
    try {
      const resp = await fetch(GATEWAY_URL + "/v1/profiles");
      if (!resp.ok) return;
      const profiles = await resp.json();

      profileSel.innerHTML = "";
      profiles.forEach(function (p) {
        const opt = document.createElement("option");
        opt.value = p.id;
        opt.textContent = p.name;
        if (p.id === "default") opt.selected = true;
        profileSel.appendChild(opt);
      });
    } catch (_) {
      profileSel.innerHTML = "<option value=''>Default</option>";
    }
  }

  loadProfiles();

  // -- Chat -----------------------------------------------------------------

  function addMessage(role, content) {
    const div = document.createElement("div");
    div.className = "message " + role;
    div.textContent = content;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function setStreaming(active) {
    streaming = active;
    sendBtn.disabled = active;
    inputEl.disabled = active;
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text || streaming) return;

    inputEl.value = "";
    inputEl.style.height = "auto";
    addMessage("user", text);
    history.push({ role: "user", content: text });

    setStreaming(true);
    const assistantDiv = addMessage("assistant", "");

    const profile = profileSel.value || undefined;

    try {
      const resp = await fetch(GATEWAY_URL + "/v1/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history, profile: profile }),
      });

      if (!resp.ok) {
        throw new Error("Gateway returned " + resp.status);
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let full = "";
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const payload = line.slice(6);
          if (payload === "[DONE]") continue;

          try {
            const chunk = JSON.parse(payload);
            if (chunk.content) {
              full += chunk.content;
              assistantDiv.textContent = full;
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }
          } catch (_) {}
        }
      }

      history.push({ role: "assistant", content: full });
    } catch (err) {
      addMessage("error", "Error: " + err.message);
    } finally {
      setStreaming(false);
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", send);

  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  inputEl.addEventListener("input", function () {
    this.style.height = "auto";
    this.style.height = Math.min(this.scrollHeight, 160) + "px";
  });
})();
</script>

</body>
</html>
