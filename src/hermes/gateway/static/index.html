<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Workspace</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0e14;
    --bg-sidebar: #0d1117;
    --surface: #151b23;
    --surface-hover: #1a2130;
    --border: #1e2a3a;
    --text: #d1d5db;
    --text-muted: #6b7280;
    --text-dim: #4b5563;
    --accent: #2dd4a8;
    --accent-dim: #1a3a32;
    --accent-hover: #34e0b4;
    --red: #f87171;
    --user-bg: #1a2130;
    --assistant-bg: #111820;
    --sidebar-width: 200px;
  }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  /* ── Shell layout ─────────────────────────────────── */

  #workspace {
    display: flex;
    height: 100%;
  }

  /* ── Sidebar ──────────────────────────────────────── */

  #sidebar {
    width: var(--sidebar-width);
    min-width: var(--sidebar-width);
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  #sidebar-header {
    padding: 14px 16px;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--border);
  }

  .nav-section {
    padding: 12px 0 4px;
  }

  .nav-section-title {
    padding: 0 16px 6px;
    font-size: 10px;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .nav-item {
    display: flex;
    align-items: center;
    padding: 7px 16px;
    font-size: 13px;
    color: var(--text-muted);
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: background 0.1s, color 0.1s;
  }

  .nav-item:hover {
    background: var(--surface-hover);
    color: var(--text);
  }

  .nav-item.active {
    background: var(--surface);
    color: var(--accent);
    border-left-color: var(--accent);
  }

  .nav-badge {
    margin-left: auto;
    font-size: 9px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 3px;
    background: var(--accent);
    color: var(--bg);
    letter-spacing: 0.04em;
  }

  .sessions-list {
    padding: 4px 0;
  }

  .session-item {
    padding: 8px 16px;
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    border-left: 2px solid transparent;
  }

  .session-item:hover {
    background: var(--surface-hover);
    color: var(--text);
  }

  .session-item.active {
    color: var(--accent);
    border-left-color: var(--accent);
  }

  .session-meta {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  /* ── Main area ────────────────────────────────────── */

  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  /* ── Top header ───────────────────────────────────── */

  #topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    min-height: 48px;
  }

  #topbar-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  #topbar-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.02em;
  }

  #topbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .topbar-btn {
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 500;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    font-family: inherit;
  }

  .topbar-btn:hover {
    background: var(--surface-hover);
    color: var(--text);
  }

  .topbar-btn.primary {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
    font-weight: 600;
  }

  .topbar-btn.primary:hover {
    background: var(--accent-hover);
  }

  /* ── Status bar ───────────────────────────────────── */

  #statusbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 6px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-dim);
    background: var(--bg);
  }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }

  .status-dot.offline {
    background: var(--text-dim);
  }

  .status-label {
    color: var(--text-muted);
    font-family: monospace;
    font-size: 11px;
  }

  /* ── Content area ─────────────────────────────────── */

  #content {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .view {
    display: none;
    flex: 1;
    flex-direction: column;
  }

  .view.active {
    display: flex;
  }

  /* ── Today view ───────────────────────────────────── */

  #view-today {
    padding: 24px;
    gap: 20px;
    overflow-y: auto;
  }

  #today-header {
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }

  #today-attention {
    padding: 16px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    color: var(--text-muted);
  }

  .widget-row {
    display: flex;
    gap: 16px;
  }

  .widget {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    flex: 1;
  }

  .widget-title {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .widget-value {
    font-size: 36px;
    font-weight: 600;
    color: var(--text);
    line-height: 1;
  }

  .widget-sub {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  .widget-coming-soon {
    font-size: 12px;
    color: var(--text-dim);
    font-style: italic;
  }

  .model-name {
    font-size: 24px;
    font-weight: 600;
    color: var(--text);
  }

  .model-meta {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 6px;
  }

  /* ── Chat view ────────────────────────────────────── */

  #view-chat {
    flex-direction: column;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .message {
    padding: 12px 16px;
    border-radius: 8px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14px;
    max-width: 85%;
  }

  .message.user {
    background: var(--user-bg);
    align-self: flex-end;
    border: 1px solid var(--border);
  }

  .message.assistant {
    background: var(--assistant-bg);
    align-self: flex-start;
  }

  .message.error {
    background: #2d1b1b;
    color: var(--red);
    align-self: center;
    font-size: 13px;
  }

  #chat-empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 14px;
  }

  #input-area {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
  }

  #input-area textarea {
    flex: 1;
    padding: 10px 14px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    resize: none;
    outline: none;
    min-height: 40px;
    max-height: 160px;
  }

  #input-area textarea:focus {
    border-color: var(--accent);
  }

  #input-area button {
    padding: 10px 18px;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  #input-area button:hover { background: var(--accent-hover); }
  #input-area button:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── List / detail views (reused by Documents, Operations, Jobs) ── */

  .list-view {
    padding: 24px;
    overflow-y: auto;
    flex: 1;
  }

  .list-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 16px;
  }

  .list-title {
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
  }

  .list-count {
    font-size: 13px;
    color: var(--text-dim);
  }

  .list-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: background 0.1s, border-color 0.1s;
  }

  .list-item:hover {
    background: var(--surface-hover);
    border-color: var(--accent-dim);
  }

  .list-item-main {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .list-item-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }

  .list-item-meta {
    font-size: 11px;
    color: var(--text-dim);
  }

  .list-empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
  }

  .detail-view {
    padding: 24px;
    overflow-y: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .detail-header {
    margin-bottom: 20px;
  }

  .detail-title {
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
  }

  .detail-meta {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  .detail-actions {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .detail-btn {
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 500;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    font-family: inherit;
  }

  .detail-btn:hover {
    background: var(--surface-hover);
    color: var(--text);
  }

  .detail-btn.accent {
    border-color: var(--accent-dim);
    color: var(--accent);
  }

  .detail-btn.accent:hover {
    background: var(--accent-dim);
  }

  .detail-btn.danger {
    border-color: #7f1d1d;
    color: var(--red);
  }

  .detail-btn.danger:hover {
    background: #7f1d1d;
  }

  .detail-content {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    overflow-y: auto;
  }

  /* ── Status badge ─────────────────────────────────── */

  .status-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .status-badge.created       { background: var(--surface-hover); color: var(--text-muted); }
  .status-badge.executing     { background: #1a3a32; color: var(--accent); }
  .status-badge.completed     { background: #1a2a1a; color: #86efac; }
  .status-badge.failed        { background: #2d1b1b; color: var(--red); }
  .status-badge.awaiting_escalation { background: #3a2a0a; color: #fbbf24; }
  .status-badge.rejected      { background: #2d1b1b; color: var(--red); }

  /* ── Filter bar ─────────────────────────────────── */

  .filter-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .filter-btn {
    padding: 4px 12px;
    font-size: 11px;
    font-weight: 500;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    font-family: inherit;
  }

  .filter-btn:hover {
    background: var(--surface-hover);
    color: var(--text);
  }

  .filter-btn.active {
    border-color: var(--accent-dim);
    color: var(--accent);
    background: var(--accent-dim);
  }

  /* ── Detail section ─────────────────────────────── */

  .detail-section {
    margin-bottom: 20px;
  }

  .detail-section-title {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  /* ── Coming Soon view ─────────────────────────────── */

  .view-placeholder {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    color: var(--text-dim);
  }

  .view-placeholder-title {
    font-size: 16px;
    font-weight: 500;
    color: var(--text-muted);
  }

  .view-placeholder-sub {
    font-size: 13px;
  }

  /* ── Profile selector ─────────────────────────────── */

  #profile-select {
    padding: 5px 8px;
    background: var(--surface);
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 5px;
    font-family: inherit;
    font-size: 11px;
    outline: none;
    cursor: pointer;
  }

  #profile-select:focus {
    border-color: var(--accent);
  }
</style>
</head>
<body>

<div id="workspace">

  <!-- ── Sidebar ──────────────────────────────────── -->
  <div id="sidebar">

    <div id="sidebar-header">Hermes Workspace</div>

    <div class="nav-item" data-view="search">Search</div>
    <div class="nav-item" data-action="new-chat">New Session</div>

    <div class="nav-section">
      <div class="nav-section-title">Main</div>
      <div class="nav-item active" data-view="today">Today</div>
      <div class="nav-item" data-view="chat">Chat</div>
      <div class="nav-item" data-view="operations">Operations</div>
      <div class="nav-item" data-view="jobs">Jobs</div>
    </div>

    <div class="nav-section">
      <div class="nav-section-title">Knowledge</div>
      <div class="nav-item" data-view="documents">Documents</div>
      <div class="nav-item" data-view="memory">Memory</div>
      <div class="nav-item" data-view="skills">Skills</div>
      <div class="nav-item" data-view="mcp">MCP</div>
      <div class="nav-item" data-view="profiles">Profiles</div>
    </div>

    <div class="nav-section">
      <div class="nav-section-title">Sessions</div>
      <div class="sessions-list" id="sessions-list">
      </div>
    </div>

  </div>

  <!-- ── Main area ────────────────────────────────── -->
  <div id="main">

    <div id="topbar">
      <div id="topbar-left">
        <div id="topbar-title">Hermes Workspace</div>
      </div>
      <div id="topbar-right">
        <button class="topbar-btn primary" id="btn-new-chat">New Chat</button>
        <select id="profile-select"><option value="">Loading...</option></select>
      </div>
    </div>

    <div id="statusbar">
      <span class="status-pill">
        <span class="status-dot" id="status-gateway-dot"></span>
        <span class="status-label" id="status-gateway">Gateway</span>
      </span>
      <span class="status-pill">
        <span class="status-dot offline" id="status-api-dot"></span>
        <span class="status-label" id="status-api">API Server</span>
      </span>
    </div>

    <div id="content">

      <!-- Today view -->
      <div id="view-today" class="view active">
        <div id="today-header"></div>
        <div id="today-attention"></div>
        <div class="widget-row" id="today-widgets"></div>
      </div>

      <!-- Chat view -->
      <div id="view-chat" class="view">
        <div id="messages">
          <div id="chat-empty">What would you like to accomplish today?</div>
        </div>
        <div id="input-area">
          <textarea id="input" rows="1" placeholder="Send a message..." autofocus></textarea>
          <button id="send">Send</button>
        </div>
      </div>

      <!-- Placeholder views -->
      <div id="view-search" class="view"><div class="view-placeholder"><div class="view-placeholder-title">Search</div><div class="view-placeholder-sub">Coming soon</div></div></div>
      <div id="view-operations" class="view">
        <div id="operations-list" class="list-view"></div>
        <div id="operations-detail" class="detail-view" style="display:none"></div>
      </div>
      <div id="view-jobs" class="view">
        <div id="jobs-list" class="list-view"></div>
        <div id="jobs-detail" class="detail-view" style="display:none"></div>
      </div>
      <div id="view-documents" class="view">
        <div id="documents-list" class="list-view"></div>
        <div id="documents-detail" class="detail-view" style="display:none"></div>
      </div>
      <div id="view-memory" class="view"><div class="view-placeholder"><div class="view-placeholder-title">Memory</div><div class="view-placeholder-sub">Coming soon</div></div></div>
      <div id="view-skills" class="view"><div class="view-placeholder"><div class="view-placeholder-title">Skills</div><div class="view-placeholder-sub">Coming soon</div></div></div>
      <div id="view-mcp" class="view"><div class="view-placeholder"><div class="view-placeholder-title">MCP</div><div class="view-placeholder-sub">Coming soon</div></div></div>
      <div id="view-profiles" class="view"><div class="view-placeholder"><div class="view-placeholder-title">Profiles</div><div class="view-placeholder-sub">Coming soon</div></div></div>

    </div>
  </div>
</div>

<script>
(function () {
  var GATEWAY = window.__HERMES_GATEWAY_URL__ || window.location.origin;

  // ── DOM refs ──────────────────────────────────────
  var messagesEl   = document.getElementById("messages");
  var chatEmpty    = document.getElementById("chat-empty");
  var inputEl      = document.getElementById("input");
  var sendBtn      = document.getElementById("send");
  var profileSel   = document.getElementById("profile-select");
  var sessionsList = document.getElementById("sessions-list");
  var todayHeader    = document.getElementById("today-header");
  var todayAttention = document.getElementById("today-attention");
  var todayWidgets   = document.getElementById("today-widgets");

  var history = [];
  var streaming = false;
  var currentView = "today";

  // ── Navigation ────────────────────────────────────

  function switchView(name) {
    document.querySelectorAll(".view").forEach(function (v) { v.classList.remove("active"); });
    document.querySelectorAll(".nav-item").forEach(function (n) { n.classList.remove("active"); });

    var view = document.getElementById("view-" + name);
    if (view) view.classList.add("active");

    var nav = document.querySelector('.nav-item[data-view="' + name + '"]');
    if (nav) nav.classList.add("active");

    currentView = name;
    if (name === "chat") inputEl.focus();
    if (name === "documents") loadDocuments();
    if (name === "operations") loadOperations();
    if (name === "jobs") loadJobs();
  }

  document.querySelectorAll(".nav-item[data-view]").forEach(function (el) {
    el.addEventListener("click", function () {
      switchView(el.dataset.view);
    });
  });

  // New Session / New Chat → switch to chat
  document.querySelectorAll('[data-action="new-chat"]').forEach(function (el) {
    el.addEventListener("click", function () {
      history = [];
      messagesEl.innerHTML = "";
      chatEmpty = document.createElement("div");
      chatEmpty.id = "chat-empty";
      chatEmpty.textContent = "What would you like to accomplish today?";
      messagesEl.appendChild(chatEmpty);
      switchView("chat");
    });
  });

  document.getElementById("btn-new-chat").addEventListener("click", function () {
    history = [];
    messagesEl.innerHTML = "";
    var empty = document.createElement("div");
    empty.id = "chat-empty";
    empty.textContent = "What would you like to accomplish today?";
    messagesEl.appendChild(empty);
    switchView("chat");
  });

  // ── Load profiles ─────────────────────────────────

  function loadProfiles() {
    fetch(GATEWAY + "/v1/profiles")
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (profiles) {
        profileSel.innerHTML = "";
        profiles.forEach(function (p) {
          var opt = document.createElement("option");
          opt.value = p.id;
          opt.textContent = p.name;
          if (p.id === "default") opt.selected = true;
          profileSel.appendChild(opt);
        });
      })
      .catch(function () {
        profileSel.innerHTML = "<option value=''>Default</option>";
      });
  }

  // ── Load dashboard ────────────────────────────────

  function loadDashboard() {
    // Fetch dashboard and operations in parallel (Founder amendment 1)
    var dashboardPromise = fetch(GATEWAY + "/v1/dashboard")
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; });

    var operationsPromise = fetch(GATEWAY + "/v1/operations")
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; });

    Promise.all([dashboardPromise, operationsPromise]).then(function (results) {
      var data = results[0];
      var opsList = results[1];
      if (!data) return;
      renderToday(data, opsList);
    });
  }

  function computeTodayOpsStats(opsList) {
    var today = new Date().toISOString().slice(0, 10);
    var active = 0;
    var completedToday = 0;
    var escalated = [];

    for (var i = 0; i < opsList.length; i++) {
      var op = opsList[i];
      if (op.status === "created" || op.status === "executing") active++;
      if (op.status === "completed" && op.updated_at && op.updated_at.slice(0, 10) === today) completedToday++;
      if (op.status === "awaiting_escalation") escalated.push(op);
    }

    return { active: active, completedToday: completedToday, total: opsList.length, escalated: escalated };
  }

  function renderToday(data, opsList) {
    var ws = data.workspace || {};
    var knowledge = data.knowledge || {};
    var repositories = data.repositories || {};
    var opsAvailable = opsList !== null;
    var opsStats = opsAvailable ? computeTodayOpsStats(opsList) : null;

    // Header
    todayHeader.textContent = ws.name || "Hermes";

    // Attention section (attention-first per UX spec)
    if (!opsAvailable) {
      todayAttention.innerHTML = '<div style="color:var(--text-dim)">Unable to load Operations.</div>';
    } else if (opsStats.escalated.length > 0) {
      var maxShow = 5;
      var ahtml = "";
      var shown = Math.min(opsStats.escalated.length, maxShow);
      for (var ai = 0; ai < shown; ai++) {
        var esc_op = opsStats.escalated[ai];
        ahtml += '<div class="today-attention-item" data-op-id="' + esc(esc_op.id) + '" style="margin-bottom:6px;cursor:pointer;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:6px">';
        ahtml += '<span class="status-badge awaiting_escalation" style="margin-right:8px">Escalated</span>';
        ahtml += '<span>' + esc(esc_op.request) + '</span>';
        ahtml += '<span style="margin-left:8px;color:var(--text-dim);font-size:11px">' + esc(esc_op.id) + '</span>';
        ahtml += '</div>';
      }
      if (opsStats.escalated.length > maxShow) {
        ahtml += '<div style="font-size:12px;color:var(--text-dim);margin-top:4px">...and ' + (opsStats.escalated.length - maxShow) + ' more</div>';
      }
      todayAttention.innerHTML = ahtml;

      todayAttention.querySelectorAll(".today-attention-item[data-op-id]").forEach(function (el) {
        el.addEventListener("click", function () {
          switchView("operations");
          openOperation(el.dataset.opId);
        });
      });
    } else {
      todayAttention.textContent = "No items need your attention.";
    }

    // Operating state widgets
    var html = "";

    html += '<div class="widget" id="today-ops-widget" style="cursor:pointer">';
    html += '  <div class="widget-title">Operations</div>';
    if (opsAvailable) {
      html += '  <div class="widget-value">' + opsStats.active + '</div>';
      html += '  <div class="widget-sub">active</div>';
      html += '  <div class="widget-sub">' + opsStats.completedToday + ' completed today &middot; ' + opsStats.total + ' total</div>';
    } else {
      html += '  <div class="widget-coming-soon">Unavailable</div>';
    }
    html += '</div>';

    html += '<div class="widget">';
    html += '  <div class="widget-title">Knowledge</div>';
    html += '  <div class="widget-value">' + (knowledge.count || 0) + '</div>';
    html += '  <div class="widget-sub">documents</div>';
    html += '</div>';

    html += '<div class="widget">';
    html += '  <div class="widget-title">Repositories</div>';
    html += '  <div class="widget-value">' + (repositories.count || 0) + '</div>';
    html += '  <div class="widget-sub">connected</div>';
    html += '</div>';

    if (ws.mission) {
      html += '<div class="widget">';
      html += '  <div class="widget-title">Mission</div>';
      html += '  <div style="font-size:13px;color:var(--text-muted);line-height:1.5">' + esc(ws.mission) + '</div>';
      html += '</div>';
    }

    todayWidgets.innerHTML = html;

    // Operations widget click-through
    var opsWidget = document.getElementById("today-ops-widget");
    if (opsWidget) {
      opsWidget.addEventListener("click", function () {
        switchView("operations");
      });
    }
  }

  // ── Health check ──────────────────────────────────

  function checkHealth() {
    fetch(GATEWAY + "/health")
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        var dot = document.getElementById("status-gateway-dot");
        var apiDot = document.getElementById("status-api-dot");

    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";

  // ── Operations ────────────────────────────────────

  var opsListEl   = document.getElementById("operations-list");
  var opsDetailEl = document.getElementById("operations-detail");
  var opsCache = [];
  var opsFilter = "all";

  function loadOperations() {
    opsListEl.style.display = "block";
    opsDetailEl.style.display = "none";
    fetch(GATEWAY + "/v1/operations")
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (ops) {
        opsCache = ops;
        opsFilter = "all";
        renderOperationsList(ops);
      })
      .catch(function () {
        opsListEl.innerHTML = '<div class="list-empty">Cannot load Operations.</div>';
      });
  }

  function renderOperationsList(ops) {
    // Sort by updated_at descending
    ops = ops.slice().sort(function (a, b) {
      return b.updated_at.localeCompare(a.updated_at);
    });

    var html = '<div class="list-header">';
    html += '<div class="list-title">Operations</div>';
    html += '<div class="list-count">' + ops.length + ' operations</div>';
    html += '</div>';

    // Filter bar
    html += '<div class="filter-bar">';
    var filters = ["all", "executing", "awaiting_escalation", "completed", "failed", "rejected"];
    for (var fi = 0; fi < filters.length; fi++) {
      var f = filters[fi];
      var label = f === "all" ? "All" : f === "awaiting_escalation" ? "Escalated" : f.charAt(0).toUpperCase() + f.slice(1);
      html += '<button class="filter-btn' + (opsFilter === f ? ' active' : '') + '" data-filter="' + f + '">' + label + '</button>';
    }
    html += '</div>';

    var filtered = opsFilter === "all" ? ops : ops.filter(function (o) { return o.status === opsFilter; });

    if (filtered.length === 0) {
      if (opsCache.length === 0) {
        html += '<div class="list-empty">No Operations yet.</div>';
      } else {
        html += '<div class="list-empty">No Operations match this filter.</div>';
      }
    } else {
      for (var i = 0; i < filtered.length; i++) {
        var op = filtered[i];
        html += '<div class="list-item" data-op-id="' + esc(op.id) + '">';
        html += '  <div class="list-item-main">';
        html += '    <div class="list-item-title">' + esc(op.request) + '</div>';
        html += '    <div class="list-item-meta">' + esc(op.id) + ' &middot; ' + formatDate(op.updated_at) + '</div>';
        html += '  </div>';
        html += '  <span class="status-badge ' + esc(op.status) + '">' + formatStatus(op.status) + '</span>';
        html += '</div>';
      }
    }

    opsListEl.innerHTML = html;

    opsListEl.querySelectorAll(".filter-btn[data-filter]").forEach(function (el) {
      el.addEventListener("click", function () {
        opsFilter = el.dataset.filter;
        renderOperationsList(opsCache);
      });
    });

    opsListEl.querySelectorAll(".list-item[data-op-id]").forEach(function (el) {
      el.addEventListener("click", function () {
        openOperation(el.dataset.opId);
      });
    });
  }

  function formatStatus(status) {
    if (status === "awaiting_escalation") return "Escalated";
    return status.charAt(0).toUpperCase() + status.slice(1);
  }

  function formatDate(iso) {
    try {
      var d = new Date(iso);
      return d.toLocaleDateString() + " " + d.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
    } catch (e) { return iso; }
  }

  function openOperation(id) {
    opsListEl.style.display = "none";
    opsDetailEl.style.display = "flex";
    opsDetailEl.innerHTML = '<div class="list-empty">Loading...</div>';

    fetch(GATEWAY + "/v1/operations/" + encodeURIComponent(id))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (op) {
        if (!op) {
          opsDetailEl.innerHTML = '<div class="list-empty">Cannot load this Operation.</div>';
          return;
        }
        renderOperationDetail(op);
      })
      .catch(function () {
        opsDetailEl.innerHTML = '<div class="list-empty">Cannot load this Operation.</div>';
      });
  }

  function renderOperationDetail(op) {
    var html = '<div class="detail-header">';
    html += '  <div class="detail-title">' + esc(op.request) + '</div>';
    html += '  <div class="detail-meta">' + esc(op.id) + ' &middot; <span class="status-badge ' + esc(op.status) + '">' + formatStatus(op.status) + '</span></div>';
    html += '</div>';

    html += '<div class="detail-actions">';
    html += '  <button class="detail-btn" id="op-back">Back</button>';
    if (op.status === "awaiting_escalation") {
      html += '  <button class="detail-btn accent" id="op-approve">Approve</button>';
      html += '  <button class="detail-btn danger" id="op-reject">Reject</button>';
    }
    html += '</div>';

    // Timestamps
    html += '<div class="detail-section">';
    html += '  <div class="detail-section-title">Timeline</div>';
    html += '  <div class="list-item-meta">Created: ' + formatDate(op.created_at) + '</div>';
    html += '  <div class="list-item-meta">Updated: ' + formatDate(op.updated_at) + '</div>';
    html += '</div>';

    // Jobs section
    html += '<div class="detail-section">';
    html += '  <div class="detail-section-title">Jobs</div>';
    html += '  <div id="op-jobs-list"><div class="list-empty">Loading jobs...</div></div>';
    html += '</div>';

    // Decisions placeholder
    html += '<div class="detail-section">';
    html += '  <div class="detail-section-title">Decisions</div>';
    html += '  <div class="list-empty">No Decisions recorded.</div>';
    html += '</div>';

    opsDetailEl.innerHTML = html;

    document.getElementById("op-back").addEventListener("click", function () {
      loadOperations();
    });

    if (op.status === "awaiting_escalation") {
      document.getElementById("op-approve").addEventListener("click", function () {
        approveOperation(op.id);
      });
      document.getElementById("op-reject").addEventListener("click", function () {
        rejectOperation(op.id);
      });
    }

    // Load jobs for this operation (client-side filter)
    loadOperationJobs(op.id);
  }

  function loadOperationJobs(operationId) {
    var jobsEl = document.getElementById("op-jobs-list");
    fetch(GATEWAY + "/v1/jobs")
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (jobs) {
        var opJobs = jobs.filter(function (j) { return j.operation_id === operationId; });
        if (opJobs.length === 0) {
          jobsEl.innerHTML = '<div class="list-empty">No Jobs for this Operation.</div>';
          return;
        }
        var html = "";
        for (var i = 0; i < opJobs.length; i++) {
          var j = opJobs[i];
          html += '<div class="list-item">';
          html += '  <div class="list-item-main">';
          html += '    <div class="list-item-title">' + esc(j.id) + '</div>';
          html += '    <div class="list-item-meta">' + (j.completed_steps || []).join(", ") + ' &middot; ' + formatDate(j.finished_at) + '</div>';
          html += '  </div>';
          html += '  <span class="status-badge ' + esc(j.status) + '">' + formatStatus(j.status) + '</span>';
          html += '</div>';
        }
        jobsEl.innerHTML = html;
      })
      .catch(function () {
        jobsEl.innerHTML = '<div class="list-empty">Cannot load Jobs.</div>';
      });
  }

  function approveOperation(id) {
    fetch(GATEWAY + "/v1/operations/" + encodeURIComponent(id) + "/approve", { method: "POST" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (op) {
        if (op) renderOperationDetail(op);
      })
      .catch(function () {});
  }

  function rejectOperation(id) {
    fetch(GATEWAY + "/v1/operations/" + encodeURIComponent(id) + "/reject", { method: "POST" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (op) {
        if (op) renderOperationDetail(op);
      })
      .catch(function () {});
  }

  // ── Jobs ──────────────────────────────────────────

  var jobsListEl   = document.getElementById("jobs-list");
  var jobsDetailEl = document.getElementById("jobs-detail");
  var jobsCache = [];
  var jobsStatusFilter = "all";
  var jobsOpFilter = "all";

  function loadJobs() {
    jobsListEl.style.display = "block";
    jobsDetailEl.style.display = "none";
    fetch(GATEWAY + "/v1/jobs")
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (jobs) {
        jobsCache = jobs;
        jobsStatusFilter = "all";
        jobsOpFilter = "all";
        renderJobsList(jobs);
      })
      .catch(function () {
        jobsListEl.innerHTML = '<div class="list-empty">Cannot load Jobs.</div>';
      });
  }

  function renderJobsList(jobs) {
    // Sort by finished_at descending (most recent first)
    jobs = jobs.slice().sort(function (a, b) {
      return (b.finished_at || "").localeCompare(a.finished_at || "");
    });

    var html = '<div class="list-header">';
    html += '<div class="list-title">Jobs</div>';
    html += '<div class="list-count">' + jobs.length + ' jobs</div>';
    html += '</div>';

    // Status filter bar
    html += '<div class="filter-bar" id="jobs-status-filter">';
    var statuses = ["all", "completed", "awaiting_approval", "failed"];
    for (var si = 0; si < statuses.length; si++) {
      var s = statuses[si];
      var label = s === "all" ? "All" : s === "awaiting_approval" ? "Awaiting Approval" : s.charAt(0).toUpperCase() + s.slice(1);
      html += '<button class="filter-btn' + (jobsStatusFilter === s ? ' active' : '') + '" data-job-status="' + s + '">' + label + '</button>';
    }

    // Operation filter
    var opIds = [];
    for (var oi = 0; oi < jobsCache.length; oi++) {
      var opId = jobsCache[oi].operation_id;
      if (opId && opIds.indexOf(opId) === -1) opIds.push(opId);
    }
    opIds.sort();
    html += '<select id="jobs-op-select" style="padding:4px 8px;font-size:11px;background:var(--surface);color:var(--text-muted);border:1px solid var(--border);border-radius:4px;font-family:inherit;cursor:pointer">';
    html += '<option value="all"' + (jobsOpFilter === "all" ? ' selected' : '') + '>All Operations</option>';
    for (var pi = 0; pi < opIds.length; pi++) {
      html += '<option value="' + esc(opIds[pi]) + '"' + (jobsOpFilter === opIds[pi] ? ' selected' : '') + '>' + esc(opIds[pi]) + '</option>';
    }
    html += '</select>';
    html += '</div>';

    // Apply filters
    var filtered = jobs;
    if (jobsStatusFilter !== "all") {
      filtered = filtered.filter(function (j) { return j.status === jobsStatusFilter; });
    }
    if (jobsOpFilter !== "all") {
      filtered = filtered.filter(function (j) { return j.operation_id === jobsOpFilter; });
    }

    if (filtered.length === 0) {
      if (jobsCache.length === 0) {
        html += '<div class="list-empty">No Jobs have been executed yet.</div>';
      } else {
        html += '<div class="list-empty">No Jobs match this filter.</div>';
      }
    } else {
      for (var i = 0; i < filtered.length; i++) {
        var j = filtered[i];
        html += '<div class="list-item" data-job-id="' + esc(j.id) + '">';
        html += '  <div class="list-item-main">';
        html += '    <div class="list-item-title">' + esc(j.id) + '</div>';
        html += '    <div class="list-item-meta">' + esc(j.operation_id) + ' &middot; ' + (j.completed_steps || []).join(", ") + ' &middot; ' + formatDuration(j.started_at, j.finished_at) + '</div>';
        html += '  </div>';
        html += '  <span class="status-badge ' + esc(j.status) + '">' + formatStatus(j.status) + '</span>';
        html += '</div>';
      }
    }

    jobsListEl.innerHTML = html;

    // Bind status filter buttons
    jobsListEl.querySelectorAll(".filter-btn[data-job-status]").forEach(function (el) {
      el.addEventListener("click", function () {
        jobsStatusFilter = el.dataset.jobStatus;
        renderJobsList(jobsCache);
      });
    });

    // Bind Operation filter
    var opSelect = document.getElementById("jobs-op-select");
    if (opSelect) {
      opSelect.addEventListener("change", function () {
        jobsOpFilter = opSelect.value;
        renderJobsList(jobsCache);
      });
    }

    // Bind list items
    jobsListEl.querySelectorAll(".list-item[data-job-id]").forEach(function (el) {
      el.addEventListener("click", function () {
        openJob(el.dataset.jobId);
      });
    });
  }

  function formatDuration(start, end) {
    if (!start) return "Unknown";
    if (!end) return "Running...";
    try {
      var ms = new Date(end) - new Date(start);
      if (ms < 1000) return ms + "ms";
      var secs = Math.floor(ms / 1000);
      if (secs < 60) return secs + "s";
      var mins = Math.floor(secs / 60);
      secs = secs % 60;
      return mins + "m " + secs + "s";
    } catch (e) { return "Unknown"; }
  }

  function openJob(id) {
    jobsListEl.style.display = "none";
    jobsDetailEl.style.display = "flex";
    jobsDetailEl.innerHTML = '<div class="list-empty">Loading...</div>';

    fetch(GATEWAY + "/v1/jobs/" + encodeURIComponent(id))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (job) {
        if (!job) {
          jobsDetailEl.innerHTML = '<div class="list-empty">Cannot load this Job.</div>';
          return;
        }
        renderJobDetail(job);
      })
      .catch(function () {
        jobsDetailEl.innerHTML = '<div class="list-empty">Cannot load this Job.</div>';
      });
  }

  function renderJobDetail(job) {
    var html = '<div class="detail-header">';
    html += '  <div class="detail-title">' + esc(job.id) + '</div>';
    html += '  <div class="detail-meta"><span class="job-parent-op" data-op="' + esc(job.operation_id) + '" style="cursor:pointer;color:var(--accent)">' + esc(job.operation_id) + '</span> &middot; <span class="status-badge ' + esc(job.status) + '">' + formatStatus(job.status) + '</span></div>';
    html += '</div>';

    html += '<div class="detail-actions">';
    html += '  <button class="detail-btn" id="job-back">Back</button>';
    html += '  <button class="detail-btn accent" id="job-view-op">View Operation</button>';
    html += '</div>';

    // Timeline
    html += '<div class="detail-section">';
    html += '  <div class="detail-section-title">Timeline</div>';
    html += '  <div class="list-item-meta">Started: ' + formatDate(job.started_at) + '</div>';
    html += '  <div class="list-item-meta">Finished: ' + formatDate(job.finished_at) + '</div>';
    html += '  <div class="list-item-meta">Duration: ' + formatDuration(job.started_at, job.finished_at) + '</div>';
    html += '</div>';

    // Generated Output
    html += '<div class="detail-section">';
    html += '  <div class="detail-section-title">Generated Output</div>';
    if (job.generated_output) {
      html += '  <div class="detail-content">' + esc(job.generated_output) + '</div>';
    } else {
      html += '  <div class="list-empty">This Job completed without generated output.</div>';
    }
    html += '</div>';

    // Completed Steps
    html += '<div class="detail-section">';
    html += '  <div class="detail-section-title">Completed Steps</div>';
    if (job.completed_steps && job.completed_steps.length > 0) {
      html += '  <div class="list-item-meta">' + job.completed_steps.map(function (s) { return esc(s); }).join(" &rarr; ") + '</div>';
    } else {
      html += '  <div class="list-empty">No steps recorded.</div>';
    }
    html += '</div>';

    // Diagnostics (only if data exists — Founder amendment 1)
    html += '<div class="detail-section">';
    html += '  <div class="detail-section-title" id="job-diag-toggle" style="cursor:pointer">Diagnostics <span id="job-diag-arrow" style="font-size:8px">&#9654;</span></div>';
    if (job.diagnostics) {
      html += '  <div id="job-diag-content" style="display:none">';
      var d = job.diagnostics;
      if (d.project_id) html += '    <div class="list-item-meta">Project: ' + esc(d.project_id) + '</div>';
      if (d.knowledge_documents && d.knowledge_documents.length > 0) html += '    <div class="list-item-meta">Knowledge: ' + d.knowledge_documents.map(function (k) { return esc(k); }).join(", ") + '</div>';
      if (d.files_scanned !== undefined) html += '    <div class="list-item-meta">Files scanned: ' + d.files_scanned + '</div>';
      if (d.files_selected && d.files_selected.length > 0) html += '    <div class="list-item-meta">Files selected: ' + d.files_selected.length + '</div>';
      if (d.files_read !== undefined) html += '    <div class="list-item-meta">Files read: ' + d.files_read + '</div>';
      if (d.chars_read !== undefined) html += '    <div class="list-item-meta">Chars read: ' + d.chars_read + (d.chars_truncated ? ' (' + d.chars_truncated + ' truncated)' : '') + '</div>';
      if (d.prompt_chars !== undefined) html += '    <div class="list-item-meta">Prompt size: ' + d.prompt_chars + ' chars</div>';
      html += '  </div>';
    } else {
      html += '  <div class="list-empty">No diagnostics recorded.</div>';
    }
    html += '</div>';

    jobsDetailEl.innerHTML = html;

    document.getElementById("job-back").addEventListener("click", function () {
      loadJobs();
    });

    document.getElementById("job-view-op").addEventListener("click", function () {
      navigateToOperation(job.operation_id);
    });

    // Parent Operation link in header
    var parentLink = jobsDetailEl.querySelector(".job-parent-op");
    if (parentLink) {
      parentLink.addEventListener("click", function () {
        navigateToOperation(parentLink.dataset.op);
      });
    }

    // Diagnostics toggle (only if diagnostics exist)
    if (job.diagnostics) {
      document.getElementById("job-diag-toggle").addEventListener("click", function () {
        var content = document.getElementById("job-diag-content");
        var arrow = document.getElementById("job-diag-arrow");
        if (content.style.display === "none") {
          content.style.display = "block";
          arrow.innerHTML = "&#9660;";
        } else {
          content.style.display = "none";
          arrow.innerHTML = "&#9654;";
        }
      });
    }
  }

  function navigateToOperation(operationId) {
    // Founder amendment 2: if Operation cannot be loaded, stay on Job detail
    fetch(GATEWAY + "/v1/operations/" + encodeURIComponent(operationId))
      .then(function (r) {
        if (!r.ok) throw new Error("not found");
        return r.json();
      })
      .then(function (op) {
        switchView("operations");
        // Render the operation detail directly
        opsListEl.style.display = "none";
        opsDetailEl.style.display = "flex";
        renderOperationDetail(op);
      })
      .catch(function () {
        // Stay on Job detail, show error in a temporary notice
        var notice = document.createElement("div");
        notice.className = "list-empty";
        notice.textContent = "The parent Operation could not be loaded.";
        notice.style.color = "var(--red)";
        // Insert after detail-actions
        var actions = jobsDetailEl.querySelector(".detail-actions");
        var existing = jobsDetailEl.querySelector(".op-load-error");
        if (existing) existing.remove();
        notice.className += " op-load-error";
        if (actions && actions.nextSibling) {
          actions.parentNode.insertBefore(notice, actions.nextSibling);
        } else {
          jobsDetailEl.appendChild(notice);
        }
      });
  }

  // ── Chat ──────────────────────────────────────────

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  function addMessage(role, content) {
    var empty = document.getElementById("chat-empty");
    if (empty) empty.remove();

    var div = document.createElement("div");
    div.className = "message " + role;
    div.textContent = content;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function setStreaming(active) {
    streaming = active;
    sendBtn.disabled = active;
    inputEl.disabled = active;
  }

  function send() {
    var text = inputEl.value.trim();
    if (!text || streaming) return;

    // Auto-switch to chat if sending from another view
    if (currentView !== "chat") switchView("chat");

    inputEl.value = "";
    inputEl.style.height = "auto";
    addMessage("user", text);
    history.push({ role: "user", content: text });

    // Update session list
    updateSessionDisplay(text);

    setStreaming(true);
    var assistantDiv = addMessage("assistant", "");
    var profile = profileSel.value || undefined;

    fetch(GATEWAY + "/v1/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history, profile: profile }),
    })
    .then(function (resp) {
      if (!resp.ok) {
        return resp.json().catch(function () { return {}; }).then(function (body) {
          throw new Error(body.error || "Gateway returned " + resp.status);
        });
      }
      var reader = resp.body.getReader();
      var decoder = new TextDecoder();
      var full = "";
      var buffer = "";

      function pump() {
        return reader.read().then(function (result) {
          if (result.done) {
            history.push({ role: "assistant", content: full });
            setStreaming(false);
            inputEl.focus();
            return;
          }
          buffer += decoder.decode(result.value, { stream: true });
          var lines = buffer.split("\n");
          buffer = lines.pop();

          for (var i = 0; i < lines.length; i++) {
            if (!lines[i].startsWith("data: ")) continue;
            var payload = lines[i].slice(6);
            if (payload === "[DONE]") continue;
            try {
              var chunk = JSON.parse(payload);
              if (chunk.error) throw new Error(chunk.error);
              if (chunk.content) {
                full += chunk.content;
                assistantDiv.textContent = full;
                messagesEl.scrollTop = messagesEl.scrollHeight;
              }
            } catch (e) { if (e.message) throw e; }
          }
          return pump();
        });
      }

      return pump();
    })
    .catch(function (err) {
      addMessage("error", "Error: " + err.message);
      setStreaming(false);
      inputEl.focus();
    });
  }

  function updateSessionDisplay(firstMessage) {
    // Show current session in the sidebar
    var existing = sessionsList.querySelector(".session-item.active");
    if (!existing) {
      var label = firstMessage.length > 24 ? firstMessage.slice(0, 24) + "..." : firstMessage;
      var item = document.createElement("div");
      item.className = "session-item active";
      item.innerHTML = '<div>' + esc(label) + '</div><div class="session-meta">Local Chat</div>';
      sessionsList.prepend(item);
    }
  }

  sendBtn.addEventListener("click", send);

  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  inputEl.addEventListener("input", function () {
    this.style.height = "auto";
    this.style.height = Math.min(this.scrollHeight, 160) + "px";
  });

  // ── Init ──────────────────────────────────────────
  loadProfiles();
  loadDashboard();
  checkHealth();
})();
</script>

</body>
</html>
