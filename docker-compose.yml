services:
  hermes:
    build: .
    image: hermes-os:latest
    container_name: hermes
    restart: unless-stopped
    env_file:
      - .env
      - /opt/avanzia/secrets/hermes.env
    environment:
      HERMES_REPOSITORIES: /data/repos
      HERMES_KNOWLEDGE: /data/knowledge
      HERMES_SKILLS: /data/skills
      HERMES_LOGS: /data/logs
    volumes:
      # Canonical production workspace — repositories Hermes reads and writes.
      # Place target repositories under /opt/avanzia/repos on the host.
      - /opt/avanzia/repos:/data/repos
      # Bundled application data — shipped with the image, read-only.
      - ./knowledge:/data/knowledge:ro
      - ./skills:/data/skills:ro
      # Canonical production log directory.
      - /opt/avanzia/logs:/data/logs
    command: ["--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
