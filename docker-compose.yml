services:
  hermes:
    build: .
    image: hermes-os:latest
    container_name: hermes
    # Run as the host operator UID/GID so bind-mounted directories are
    # writable without chmod/chown. Set HERMES_UID and HERMES_GID in the
    # deployment environment; defaults to 1000:1000 (image default).
    user: "${HERMES_UID:-1000}:${HERMES_GID:-1000}"
    restart: unless-stopped
    env_file:
      - .env
      - /opt/avanzia/secrets/hermes.env
    environment:
      HERMES_REPOSITORIES: /data/repos
      HERMES_KNOWLEDGE: /data/knowledge
      HERMES_SKILLS: /data/skills
      HERMES_LOGS: /data/logs
    volumes:
      # Canonical production workspace — repositories Hermes reads and writes.
      # Place target repositories under /opt/avanzia/repos on the host.
      - /opt/avanzia/repos:/data/repos
      # Bundled application data — shipped with the image, read-only.
      - ./knowledge:/data/knowledge:ro
      - ./skills:/data/skills:ro
      # Workspace registry and runtime data (jobs, operations, heartbeats).
      # Must be writable — bind-mounted from the host so the container user
      # owns the path regardless of HERMES_UID.
      - ./workspaces:/app/workspaces
      # Canonical production log directory.
      - /opt/avanzia/logs:/data/logs
    command: ["--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    networks:
      - avanzia-shared
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hermes.rule=Host(`hermes.avanzia.tech`)"
      - "traefik.http.routers.hermes.entrypoints=websecure"
      - "traefik.http.routers.hermes.tls.certresolver=mytlschallenge"
      - "traefik.http.services.hermes.loadbalancer.server.port=8000"

networks:
  avanzia-shared:
    external: true
